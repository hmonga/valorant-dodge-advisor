name: Build and Release Windows Installer

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.10.0

      - name: Build desktop executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name ValorantDodgeAdvisor --add-data "web;web" run_desktop.py

      - name: Compile installer with Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/windows.iss

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ValorantDodgeAdvisor-Windows-Installer
          path: Output/ValorantDodgeAdvisor-Setup.exe

      - name: Attach installer to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Output/ValorantDodgeAdvisor-Setup.exe
